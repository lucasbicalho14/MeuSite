<!DOCTYPE html>
  <html>
    <head>
        <title>Página de Login</title>
    </head>
    
    <body>
        <header>
            <h1>Bicalho Corp.</h1>
        </header>
        <main>
          <!--Sessão de Login-->
         <section>
            <h2>Fazer Cadastro</h2>  
              <form>

               <input type="text" id="user" name="usuario" placeholder="Crie seu Usuário...">
                <label for="user">Usuário</label>
                
               <input type="password" id="pass" name="senha" placeholder="Crie uma Senha...">
                <label for="pass">Senha</label>

               <input type="date" id="datadenasc" name="DataNascimento">
                <label for="datadenasc">Data de Nascimento</label>
            
               <select name="Sexo" id="sexo">
                  <option value="masc">Masculino</option>
                  <option value="femi">Feminino</option>
                  <option value="indef">Prefiro não Dizer</option>
               </select>

                <input type="checkbox" value="termos" id="aceitartermos" name="termos">
                <label for="aceitartermos">Li e concordo com os termos de privacidade </label>

                <button type="submit">Cadastrar</button>
                
              </form>          
          </section>
        </main>
      
        <footer>
          <h6>® Bicalho Corp 2026</h6>
        </footer>
    </body>
</html>
