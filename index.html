<!DOCTYPE html>
  <html>
    <head>
        <title>Página de Login</title>
    </head>
    
    <body>
        <header>
            <h1>Bicalho Corp.</h1>
        </header>
        <main>
          
           <br>
          <!--Sessão de Login-->
         <section>
            <h2>Fazer Cadastroa</h2>
             <h4>Usuário</h4>
              <form>
               <input type="text" id="user" name="usuario" placeholder="Crie seu Usuário...">
              </form>
             <h4>Senha</h4>
              <form>
               <input type="password" id="pass" name="senha" placeholder="Crie uma Senha...">
              </form>
             <h4>Data de Nascimento</h4>
              <form>
               <input type="date" id="datadenasc" name="data de aniversário">
              </form>
            <h4>Sexualidade</h4>
              <form>
               <select name="Sexo" id="sexo">
                  <option value="masc">Masculino</option>
                  <option value="femi">Feminino</option>
                  <option value="indef">Prefiro não Dizer</option>
               </select>
              </form>

          <br>
           
              <form>
                <input type="checkbox" value="termos" id="aceitartermos" name="li e concordo terms">
                <label for="aceitartermos">Li e concordo com os termos de privacidade </label>
              </form>
           </section>
        </main>
    </body>
   </html>
